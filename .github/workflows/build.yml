name: KaguneX Flutter Build

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'KaguneX Job ID (e.g. KX-XXXXXXXX)'
        required: true
        type: string
      build_type:
        description: 'Build type: release or debug'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      branch:
        description: 'Unique build branch'
        required: true
        type: string
      payload_url:
        description: 'Signed URL to download the prepared Flutter ZIP'
        required: true
        type: string

jobs:
  build-flutter-apk:
    name: "Build Flutter APK [${{ inputs.build_type }}] - ${{ inputs.job_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─────────────────────────────────────────────────────
      # 1. Checkout the build branch (contains payload metadata)
      # ─────────────────────────────────────────────────────
      - name: Checkout Build Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      # ─────────────────────────────────────────────────────
      # 2. Download & extract the Flutter project
      # ─────────────────────────────────────────────────────
      - name: Download Flutter Project
        env:
          PAYLOAD_URL: ${{ inputs.payload_url }}
        run: |
          set -e
          echo "📦 Downloading project payload from build server..."
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 \
            "$PAYLOAD_URL" -o project.zip

          echo "📏 Payload size:"
          du -h project.zip

          echo "📂 Extracting project..."
          mkdir -p flutter_project
          unzip -q project.zip -d flutter_project

          # Find the actual Flutter project root (may be nested)
          if [ -f "flutter_project/pubspec.yaml" ]; then
            echo "PROJECT_DIR=flutter_project" >> "$GITHUB_ENV"
          else
            NESTED=$(find flutter_project -maxdepth 3 -name "pubspec.yaml" -type f | head -1)
            if [ -n "$NESTED" ]; then
              echo "PROJECT_DIR=$(dirname "$NESTED")" >> "$GITHUB_ENV"
            else
              echo "ERROR: pubspec.yaml not found in project"
              exit 1
            fi
          fi

          echo "✅ Project extracted successfully"

      # ─────────────────────────────────────────────────────
      # 3. Setup Java 17
      # ─────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─────────────────────────────────────────────────────
      # 4. Setup Flutter (always latest stable, never pinned)
      # ─────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ─────────────────────────────────────────────────────
      # 5. Verify Flutter installation
      # ─────────────────────────────────────────────────────
      - name: Flutter Version
        run: flutter --version

      # ─────────────────────────────────────────────────────
      # 6. Flutter pub get
      # ─────────────────────────────────────────────────────
      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "📦 Running flutter pub get..."
          flutter pub get
          echo "✅ Dependencies resolved"

      # ─────────────────────────────────────────────────────
      # 7. Build APK
      # ─────────────────────────────────────────────────────
      - name: Build APK (${{ inputs.build_type }})
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          echo "🔨 Building Flutter APK ($BUILD_TYPE)..."

          if [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk --release
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            flutter build apk --debug
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Output dir not found"
            exit 1
          fi

          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "✅ APK built successfully: $APK_PATH ($APK_SIZE)"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────
      # 8. Upload APK as Artifact
      # ─────────────────────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_type }}-${{ inputs.job_id }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
