name: Build Flutter App

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'zip atau web'
        required: true
        default: 'zip'
      job_id:
        description: 'Job ID unik dari bot'
        required: true
      branch:
        description: 'Branch berisi project (untuk flow=zip)'
        required: false
        default: 'main'
      build_mode:
        description: 'apk-debug | apk-release | aab | split-abi | apk-and-aab'
        required: true
        default: 'apk-debug'
      app_name:
        description: 'Nama aplikasi (untuk flow=web)'
        required: false
      target_url:
        description: 'URL target (untuk flow=web)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project branch (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Checkout base branch (flow=web)
        if: ${{ github.event.inputs.flow == 'web' }}
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---- Selalu pakai Flutter Stable terbaru yang tersedia (tanpa pilihan versi) ----
      - name: Setup Flutter (stable terbaru, cache aktif)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-${{ runner.os }}-stable-${{ runner.arch }}"

      # ---- Cache Gradle terpisah agar build Android lebih cepat ----
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter version info
        run: flutter --version

      - name: Scaffold WebView project (flow=web)
        if: ${{ github.event.inputs.flow == 'web' }}
        run: |
          flutter create --org com.buildbot --project-name webview_app .
          flutter pub add webview_flutter

          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '{{APP_NAME}}',
                debugShowCheckedModeBanner: false,
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController controller;
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('{{TARGET_URL}}'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(body: SafeArea(child: WebViewWidget(controller: controller)));
            }
          }
          EOF

          sed -i "s|{{APP_NAME}}|${{ github.event.inputs.app_name }}|g" lib/main.dart
          sed -i "s|{{TARGET_URL}}|${{ github.event.inputs.target_url }}|g" lib/main.dart
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Locate project root (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        id: locate
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n1)
            echo "root=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------
      # Auto-fix known incompatible dependencies (flow=zip)
      # font_awesome_flutter < 11.0.0 subclass IconData yang sekarang final
      # sejak Flutter 3.44.x (flutter/flutter#181342). Auto-fix pubspec.yaml
      # SEBELUM pub get supaya user tidak perlu edit manual.
      # ---------------------------------------------------------------
      - name: Auto-fix known incompatible packages (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        working-directory: ${{ steps.locate.outputs.root || '.' }}
        run: |
          set -e
          PUBSPEC="pubspec.yaml"
          echo "Memeriksa $PUBSPEC untuk dependency yang diketahui tidak kompatibel..."
          if grep -qE '^\s*font_awesome_flutter\s*:' "$PUBSPEC"; then
            echo "-> Menaikkan font_awesome_flutter ke ^11.0.0 (fix IconData final class)"
            sed -i -E 's/^(\s*font_awesome_flutter\s*:\s*).*/\1^11.0.0/' "$PUBSPEC"
          fi
          echo "Selesai auto-fix pubspec.yaml"

      - name: Flutter clean (Smart Build System)
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: flutter clean

      # ---- Auto Retry: pub get dicoba ulang jika gagal karena network ----
      - name: Get dependencies (dengan auto retry + auto upgrade)
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: |
          set +e
          echo "Percobaan 1: flutter pub get"
          flutter pub get
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::warning::pub get gagal, menunggu 5 detik lalu retry (kemungkinan network)..."
            sleep 5
            flutter pub get
            CODE=$?
          fi
          if [ $CODE -ne 0 ]; then
            echo "::warning::pub get masih gagal, mencoba auto-upgrade dependency major version..."
            flutter pub upgrade --major-versions
            CODE=$?
          fi
          set -e
          exit $CODE

      - name: Flutter analyze (informational, tidak menggagalkan build)
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK Debug
        if: ${{ github.event.inputs.build_mode == 'apk-debug' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: flutter build apk --debug

      - name: Build APK Release
        if: ${{ github.event.inputs.build_mode == 'apk-release' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: flutter build apk --release

      - name: Build App Bundle (.aab)
        if: ${{ github.event.inputs.build_mode == 'aab' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: flutter build appbundle --release

      - name: Build Split Per ABI
        if: ${{ github.event.inputs.build_mode == 'split-abi' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: flutter build apk --release --split-per-abi

      - name: Build APK + AAB sekaligus
        if: ${{ github.event.inputs.build_mode == 'apk-and-aab' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.job_id }}
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/bundle/release/*.aab
          retention-days: 1
          if-no-files-found: warn
