name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

      only_analyze:
        description: "Analyze only"
        required: false
        default: "false"
        type: string


permissions:
  contents: write
  actions: write


jobs:
  build:

    name: Flutter APK (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45


    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Download ZIP
        run: |
          echo "Download:"
          echo "${{ inputs.zip_url }}"

          curl -L \
          "${{ inputs.zip_url }}" \
          -o project.zip

          ls -lh project.zip
          file project.zip


          if ! unzip -t project.zip >/dev/null 2>&1
          then
            echo "ZIP tidak valid"
            head -c 300 project.zip
            exit 1
          fi


      - name: Extract Project
        run: |

          mkdir project_raw

          unzip -q project.zip -d project_raw


          echo "Isi:"
          find project_raw -maxdepth 2 -type f | head -30


          PUBSPEC=$(find project_raw -name pubspec.yaml | head -1)


          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan"
            exit 1
          fi


          PROJECT_DIR=$(dirname "$PUBSPEC")


          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project Flutter:"
          echo "$PROJECT_DIR"



      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"



      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true



      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze || true



      - name: Analyze Only Stop
        if: inputs.only_analyze == 'true'
        run: |
          echo "Analyze selesai"
          exit 0



      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get



      - name: Build Release
        if: inputs.build_type == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release



      - name: Build Debug
        if: inputs.build_type == 'debug'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --debug



      - name: Find APK
        run: |

          APK=$(find "${{ env.PROJECT_DIR }}" \
          -path "*outputs/apk/*.apk" \
          | head -1)


          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find . -name "*.apk"
            exit 1
          fi


          echo "APK:"
          echo "$APK"


          echo "APK_PATH=$APK" >> $GITHUB_ENV



      - name: Prepare Output
        run: |

          mkdir output


          if [ "${{ inputs.build_type }}" = "release" ]
          then

            cp "${{ env.APK_PATH }}" \
            "output/${{ inputs.tag }}-release.apk"

          else

            cp "${{ env.APK_PATH }}" \
            "output/${{ inputs.tag }}-debug.apk"

          fi


          ls -lah output



      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 1
          if-no-files-found: error  build:
    name: Flutter APK Build (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      - name: Download ZIP Project
        run: |
          echo "=== Download ZIP ==="

          curl -L \
          "${{ inputs.zip_url }}" \
          -o project.zip

          echo ""
          file project.zip
          ls -lh project.zip

          if ! unzip -t project.zip >/dev/null 2>&1; then
            echo "❌ ZIP tidak valid"
            echo "Isi file:"
            head -c 300 project.zip
            exit 1
          fi

          echo "✅ ZIP valid"


      - name: Extract Project
        run: |
          mkdir project_raw

          unzip -q project.zip -d project_raw

          echo "=== Isi project ==="
          ls -la project_raw


          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)


          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
              PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
              PROJECT_DIR="project_raw"
          fi


          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project:"
          echo "$PROJECT_DIR"


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true


      - name: Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f pubspec.yaml ]; then
            flutter analyze || true
          fi


      - name: Stop Analyze Only
        if: inputs.only_analyze == 'true'
        run: |
          echo "Analyze selesai"
          exit 0


      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get


      - name: Build APK Release
        if: inputs.build_type == 'release'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release


      - name: Build APK Debug
        if: inputs.build_type == 'debug'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --debug


      - name: Find APK
        run: |

          APK=$(find . -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "APK_PATH=$APK" >> $GITHUB_ENV


      - name: Rename APK
        run: |

          mkdir output

          if [ "${{ inputs.build_type }}" = "release" ]; then

            cp "${{ env.APK_PATH }}" \
            "output/${{ inputs.tag }}-release.apk"

          else

            cp "${{ env.APK_PATH }}" \
            "output/${{ inputs.tag }}-debug.apk"

          fi


      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 1
          if-no-files-found: error          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip
          echo ""
          echo "=== File Type ==="
          file project.zip
          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip
            exit 1
          fi
          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Mengunci Project Dir ==="
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            timeout 120s flutter pub get || echo "⚠️ Lanjut..."
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --${{ github.event.inputs.build_type }}
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR" && chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
          fi

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
