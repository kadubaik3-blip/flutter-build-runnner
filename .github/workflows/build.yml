name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        type: string
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Checkout (optional, for actions)
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L             -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}"             -H "Accept: application/octet-stream"             "${{ github.event.inputs.zip_url }}"             -o project.zip             -w "
=== HTTP Status: %{http_code} ===
=== Final URL: %{url_effective} ===
"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip
          echo ""
          echo "=== File Type ==="
          file project.zip || true
          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2 || true

      - name: Extract ZIP & Locate pubspec.yaml
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file (first 500 bytes) ==="
            head -c 500 project.zip
            exit 1
          fi
          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Mencari pubspec.yaml ==="
          # Cari pubspec.yaml secara rekursif (max depth 4)
          PUBSPEC_PATH=$(find project_raw -maxdepth 4 -name "pubspec.yaml" -type f | head -n 1)

          if [ -n "$PUBSPEC_PATH" ]; then
            PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
            echo "✅ Ditemukan pubspec.yaml di: $PROJECT_DIR"
          else
            # Fallback: jika hanya 1 subfolder, pakai itu
            SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
            FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
            
            if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
              PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
              echo "⚠️ Tidak ada pubspec.yaml, pakai single subdir: $PROJECT_DIR"
            else
              PROJECT_DIR="project_raw"
              echo "⚠️ Tidak ada pubspec.yaml, pakai root extract: $PROJECT_DIR"
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Final PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR" || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan di ${{ env.PROJECT_DIR }}."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          else
            echo "Skip pub get (bukan Flutter project)"
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "Building Flutter APK --${{ github.event.inputs.build_type }}"
            flutter build apk --${{ github.event.inputs.build_type }}
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLE_PATH" ]; then
              GRADLE_DIR=$(dirname "$GRADLE_PATH")
              cd "$GRADLE_DIR" && chmod +x gradlew
              if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
                ./gradlew assembleDebug
              else
                ./gradlew assembleRelease
              fi
            else
              echo "❌ Tidak ditemukan pubspec.yaml maupun gradlew"
              exit 1
            fi
          fi

      - name: Locate APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ Tidak ada file APK yang dihasilkan!"
            find $GITHUB_WORKSPACE -type f -name "*.apk" || true
            ls -R ${{ env.PROJECT_DIR }}/build || true
            exit 1
          fi
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "APK ditemukan: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          ls -lh "$APK_FOUND"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
