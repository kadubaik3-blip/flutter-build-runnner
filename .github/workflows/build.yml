name: Build Flutter App

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'zip atau web'
        required: true
        default: 'zip'
      job_id:
        description: 'Job ID unik dari bot'
        required: true
      branch:
        description: 'Branch berisi project (untuk flow=zip)'
        required: false
        default: 'main'
      build_mode:
        description: 'apk-debug | apk-release | aab | split-abi | apk-and-aab'
        required: true
        default: 'apk-debug'
      flutter_version:
        description: 'stable | 3.44.x | 3.40.x | 3.35.x | 3.32.x'
        required: false
        default: 'stable'
      app_name:
        description: 'Nama aplikasi (untuk flow=web)'
        required: false
      target_url:
        description: 'URL target (untuk flow=web)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project branch (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Checkout base branch (flow=web)
        if: ${{ github.event.inputs.flow == 'web' }}
        uses: actions/checkout@v4

      # Setup Java sekaligus aktifkan cache Gradle bawaan
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # ---- Resolve Flutter version ----
      - name: Resolve Flutter version input
        id: fver
        run: |
          case "${{ github.event.inputs.flutter_version }}" in
            "stable")
              echo "version=stable" >> "$GITHUB_OUTPUT"
              ;;
            "3.44.x")
              echo "version=3.44.0" >> "$GITHUB_OUTPUT"
              ;;
            "3.40.x")
              echo "version=3.40.0" >> "$GITHUB_OUTPUT"
              ;;
            "3.35.x")
              echo "version=3.35.0" >> "$GITHUB_OUTPUT"
              ;;
            "3.32.x")
              echo "version=3.32.0" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=stable" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ---- Setup Flutter: dua jalur untuk stabilitas ----
      - name: Setup Flutter (stable)
        if: steps.fver.outputs.version == 'stable'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Flutter (specific version)
        if: steps.fver.outputs.version != 'stable'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fver.outputs.version }}
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Precache Flutter
        run: flutter precache --android

      - name: Flutter doctor
        run: flutter doctor -v

      # ---- Cache Pub (dependency Flutter) ----
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # ---- Aktifkan Gradle build cache & logging ----
      - name: Enable Gradle cache & stacktrace
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << EOF
          org.gradle.caching=true
          org.gradle.daemon=false
          org.gradle.logging.level=info
          org.gradle.console=verbose
          EOF

      - name: Flutter version info
        run: flutter --version

      # ---- WebView project scaffolding ----
      - name: Scaffold WebView project (flow=web)
        if: ${{ github.event.inputs.flow == 'web' }}
        run: |
          flutter create --org com.buildbot --project-name webview_app .
          flutter pub add webview_flutter

          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '{{APP_NAME}}',
                debugShowCheckedModeBanner: false,
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController controller;
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('{{TARGET_URL}}'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(body: SafeArea(child: WebViewWidget(controller: controller)));
            }
          }
          EOF

          sed -i "s|{{APP_NAME}}|${{ github.event.inputs.app_name }}|g" lib/main.dart
          sed -i "s|{{TARGET_URL}}|${{ github.event.inputs.target_url }}|g" lib/main.dart
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      # ---- Locate project root (wajib) ----
      - name: Locate project root (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        id: locate
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n1)
            if [ -z "$FOUND" ]; then
              echo "::error::pubspec.yaml tidak ditemukan di repositori."
              exit 1
            fi
            echo "root=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Project Root
        id: project
        run: |
          if [ "${{ github.event.inputs.flow }}" = "zip" ]; then
            echo "dir=${{ steps.locate.outputs.root }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      # ---- Auto-fix known incompatible packages ----
      - name: Auto-fix known incompatible packages (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          PUBSPEC="pubspec.yaml"
          echo "Memeriksa $PUBSPEC untuk dependency yang diketahui tidak kompatibel..."
          if grep -qE '^\s*font_awesome_flutter\s*:' "$PUBSPEC"; then
            echo "-> Menaikkan font_awesome_flutter ke ^11.0.0 (fix IconData final class)"
            sed -i -E 's/^(\s*font_awesome_flutter\s*:\s*).*/\1^11.0.0/' "$PUBSPEC"
          fi
          echo "Selesai auto-fix pubspec.yaml"

      - name: Flutter clean
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter clean

      # ---- Pub get dengan retry, timeout, dan enforce lockfile ----
      - name: Get dependencies (retry + enforce lockfile)
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set +e
          ENFORCE=""
          if [ -f "pubspec.lock" ]; then
            ENFORCE="--enforce-lockfile"
            echo "pubspec.lock ditemukan, menggunakan --enforce-lockfile"
          else
            echo "pubspec.lock tidak ditemukan, menjalankan pub get biasa"
          fi

          echo "Percobaan 1: flutter pub get $ENFORCE"
          timeout 10m flutter pub get $ENFORCE
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::warning::pub get gagal, menunggu 5 detik lalu retry..."
            sleep 5
            timeout 10m flutter pub get $ENFORCE
            CODE=$?
          fi
          if [ $CODE -ne 0 ]; then
            echo "::warning::pub get masih gagal, memperbaiki cache pub..."
            flutter pub cache repair
            timeout 10m flutter pub get $ENFORCE
            CODE=$?
          fi
          if [ $CODE -ne 0 ]; then
            echo "::warning::pub get masih gagal, mencoba upgrade minor/patch..."
            timeout 10m flutter pub upgrade
            CODE=$?
          fi
          set -e
          exit $CODE

      - name: Flutter analyze (informational)
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ---- Verifikasi sebelum build ----
      - name: Verify Android & dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter doctor -v
          flutter pub deps

      - name: Check gradlew exists
        id: gradle_check
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f "android/gradlew" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Gradle
        if: ${{ steps.gradle_check.outputs.exists == 'true' }}
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # ---- Build dengan verbose ----
      - name: Build APK Debug
        if: ${{ github.event.inputs.build_mode == 'apk-debug' }}
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --debug --verbose

      - name: Build APK Release
        if: ${{ github.event.inputs.build_mode == 'apk-release' }}
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release --verbose

      - name: Build App Bundle (.aab)
        if: ${{ github.event.inputs.build_mode == 'aab' }}
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build appbundle --release --verbose

      - name: Build Split Per ABI
        if: ${{ github.event.inputs.build_mode == 'split-abi' }}
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release --split-per-abi --verbose

      - name: Build APK + AAB sekaligus
        if: ${{ github.event.inputs.build_mode == 'apk-and-aab' }}
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk --release --verbose
          flutter build appbundle --release --verbose

      # ---- Upload log jika build gagal ----
      - name: Upload logs (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            **/build/reports/**
            **/build/**/*.log
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.job_id }}
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/bundle/release/*.aab
          retention-days: 1
          if-no-files-found: warn