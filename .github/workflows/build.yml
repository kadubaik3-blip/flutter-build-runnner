name: Build Flutter App

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'zip atau web'
        required: true
        default: 'zip'
      job_id:
        description: 'Job ID unik dari bot'
        required: true
      branch:
        description: 'Branch berisi project (untuk flow=zip)'
        required: false
        default: 'main'
      build_mode:
        description: 'apk-debug | apk-release | aab | split-abi | apk-and-aab'
        required: true
        default: 'apk-debug'
      app_name:
        description: 'Nama aplikasi (untuk flow=web)'
        required: false
      target_url:
        description: 'URL target (untuk flow=web)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project branch (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Checkout base branch (flow=web)
        if: ${{ github.event.inputs.flow == 'web' }}
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (pinned 3.32.8 stable, cache aktif)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
          cache-key: "flutter-${{ runner.os }}-3.32.8-${{ runner.arch }}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter version info
        run: flutter --version

      - name: Scaffold WebView project (flow=web)
        if: ${{ github.event.inputs.flow == 'web' }}
        run: |
          flutter create --org com.buildbot --project-name webview_app .
          flutter pub add webview_flutter

          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '{{APP_NAME}}',
                debugShowCheckedModeBanner: false,
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController controller;
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('{{TARGET_URL}}'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(body: SafeArea(child: WebViewWidget(controller: controller)));
            }
          }
          EOF

          sed -i "s|{{APP_NAME}}|${{ github.event.inputs.app_name }}|g" lib/main.dart
          sed -i "s|{{TARGET_URL}}|${{ github.event.inputs.target_url }}|g" lib/main.dart
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Locate project root (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        id: locate
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n1)
            if [ -z "$FOUND" ]; then
              echo "::error::pubspec.yaml tidak ditemukan di repository. Pastikan project Flutter ada di branch yang benar."
              exit 1
            fi
            echo "root=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Flutter clean (flow=zip)
        if: ${{ github.event.inputs.flow == 'zip' }}
        working-directory: ${{ steps.locate.outputs.root }}
        run: flutter clean

      - name: Flutter clean (flow=web)
        if: ${{ github.event.inputs.flow == 'web' }}
        run: flutter clean

      # ---- Auto Retry: pub get dicoba ulang HANYA jika gagal karena masalah network ----
      # TIDAK ada perubahan pubspec.yaml, TIDAK ada flutter pub upgrade
      - name: Get dependencies (dengan auto retry, tanpa upgrade)
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: |
          set +e
          echo "Percobaan 1: flutter pub get"
          flutter pub get
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::warning::pub get gagal, menunggu 10 detik lalu retry (kemungkinan masalah network)..."
            sleep 10
            flutter pub get
            CODE=$?
          fi
          if [ $CODE -ne 0 ]; then
            echo "::warning::pub get masih gagal, menunggu 15 detik lalu retry terakhir..."
            sleep 15
            flutter pub get
            CODE=$?
          fi
          set -e
          if [ $CODE -ne 0 ]; then
            echo "::error::flutter pub get gagal setelah 3 percobaan. Periksa pubspec.yaml dan koneksi network."
            exit $CODE
          fi

      - name: Flutter analyze (informational, tidak menggagalkan build)
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ---------------------------------------------------------------
      # Semua step build menggunakan flag verbose (-v) dan menampilkan
      # log Gradle lengkap jika terjadi kegagalan, termasuk:
      #   * What went wrong, Execution failed for task, Try, error Kotlin,
      #     error Java, error AGP, error dependency, compileSdk/minSdk
      # ---------------------------------------------------------------

      - name: Build APK Debug
        if: ${{ github.event.inputs.build_mode == 'apk-debug' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: |
          set +e
          flutter build apk --debug -v 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========== GRADLE ERROR DETAIL =========="
            grep -A 20 "FAILURE: Build failed" /tmp/flutter_build.log || true
            grep -A 10 "What went wrong:" /tmp/flutter_build.log || true
            grep -A 10 "Execution failed for task" /tmp/flutter_build.log || true
            grep -A 5 "Try:" /tmp/flutter_build.log || true
            grep -i "error:" /tmp/flutter_build.log | grep -v "^Note:" || true
            grep -i "exception" /tmp/flutter_build.log | tail -20 || true
            echo "========== END GRADLE ERROR =========="
            exit $BUILD_EXIT
          fi

      - name: Build APK Release
        if: ${{ github.event.inputs.build_mode == 'apk-release' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: |
          set +e
          flutter build apk --release -v 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========== GRADLE ERROR DETAIL =========="
            grep -A 20 "FAILURE: Build failed" /tmp/flutter_build.log || true
            grep -A 10 "What went wrong:" /tmp/flutter_build.log || true
            grep -A 10 "Execution failed for task" /tmp/flutter_build.log || true
            grep -A 5 "Try:" /tmp/flutter_build.log || true
            grep -i "error:" /tmp/flutter_build.log | grep -v "^Note:" || true
            grep -i "exception" /tmp/flutter_build.log | tail -20 || true
            echo "========== END GRADLE ERROR =========="
            exit $BUILD_EXIT
          fi

      - name: Build App Bundle (.aab)
        if: ${{ github.event.inputs.build_mode == 'aab' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: |
          set +e
          flutter build appbundle --release -v 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========== GRADLE ERROR DETAIL =========="
            grep -A 20 "FAILURE: Build failed" /tmp/flutter_build.log || true
            grep -A 10 "What went wrong:" /tmp/flutter_build.log || true
            grep -A 10 "Execution failed for task" /tmp/flutter_build.log || true
            grep -A 5 "Try:" /tmp/flutter_build.log || true
            grep -i "error:" /tmp/flutter_build.log | grep -v "^Note:" || true
            grep -i "exception" /tmp/flutter_build.log | tail -20 || true
            echo "========== END GRADLE ERROR =========="
            exit $BUILD_EXIT
          fi

      - name: Build Split Per ABI
        if: ${{ github.event.inputs.build_mode == 'split-abi' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: |
          set +e
          flutter build apk --release --split-per-abi -v 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========== GRADLE ERROR DETAIL =========="
            grep -A 20 "FAILURE: Build failed" /tmp/flutter_build.log || true
            grep -A 10 "What went wrong:" /tmp/flutter_build.log || true
            grep -A 10 "Execution failed for task" /tmp/flutter_build.log || true
            grep -A 5 "Try:" /tmp/flutter_build.log || true
            grep -i "error:" /tmp/flutter_build.log | grep -v "^Note:" || true
            grep -i "exception" /tmp/flutter_build.log | tail -20 || true
            echo "========== END GRADLE ERROR =========="
            exit $BUILD_EXIT
          fi

      - name: Build APK + AAB sekaligus
        if: ${{ github.event.inputs.build_mode == 'apk-and-aab' }}
        working-directory: ${{ github.event.inputs.flow == 'zip' && steps.locate.outputs.root || '.' }}
        run: |
          set +e
          flutter build apk --release -v 2>&1 | tee /tmp/flutter_build_apk.log
          APK_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $APK_EXIT -ne 0 ]; then
            echo ""
            echo "========== GRADLE ERROR DETAIL (APK) =========="
            grep -A 20 "FAILURE: Build failed" /tmp/flutter_build_apk.log || true
            grep -A 10 "What went wrong:" /tmp/flutter_build_apk.log || true
            grep -A 10 "Execution failed for task" /tmp/flutter_build_apk.log || true
            grep -A 5 "Try:" /tmp/flutter_build_apk.log || true
            grep -i "error:" /tmp/flutter_build_apk.log | grep -v "^Note:" || true
            grep -i "exception" /tmp/flutter_build_apk.log | tail -20 || true
            echo "========== END GRADLE ERROR =========="
            exit $APK_EXIT
          fi
          set +e
          flutter build appbundle --release -v 2>&1 | tee /tmp/flutter_build_aab.log
          AAB_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $AAB_EXIT -ne 0 ]; then
            echo ""
            echo "========== GRADLE ERROR DETAIL (AAB) =========="
            grep -A 20 "FAILURE: Build failed" /tmp/flutter_build_aab.log || true
            grep -A 10 "What went wrong:" /tmp/flutter_build_aab.log || true
            grep -A 10 "Execution failed for task" /tmp/flutter_build_aab.log || true
            grep -A 5 "Try:" /tmp/flutter_build_aab.log || true
            grep -i "error:" /tmp/flutter_build_aab.log | grep -v "^Note:" || true
            grep -i "exception" /tmp/flutter_build_aab.log | tail -20 || true
            echo "========== END GRADLE ERROR =========="
            exit $AAB_EXIT
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.job_id }}
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/bundle/release/*.aab
          retention-days: 1
          if-no-files-found: warn
