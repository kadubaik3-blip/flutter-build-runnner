name: KaguneX Flutter Build

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Build job ID
        required: true
        type: string
      build_type:
        description: Build type
        required: true
        type: choice
        options:
          - debug
          - release
      branch:
        description: Build branch
        required: true
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  FLUTTER_CHANNEL: stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Extract project payload
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          PAYLOAD="_build_payloads/${JOB_ID}.zip.b64"
          test -f "$PAYLOAD" || { echo "Payload tidak ditemukan: $PAYLOAD"; exit 1; }
          base64 -d "$PAYLOAD" > /tmp/project.zip
          rm -rf /tmp/flutter-project
          mkdir -p /tmp/flutter-project
          unzip -q /tmp/project.zip -d /tmp/flutter-project

          PROJECT_ROOT="$(find /tmp/flutter-project -name pubspec.yaml -type f -print -quit | xargs -r dirname)"
          test -n "$PROJECT_ROOT" || { echo "pubspec.yaml tidak ditemukan"; exit 1; }
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Build APK DEBUG
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build apk --debug

      - name: Build APK RELEASE
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build apk --release

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-output
          APK="$(find "$PROJECT_ROOT/build/app/outputs/flutter-apk" -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "APK tidak ditemukan"; exit 1; }
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            cp "$APK" /tmp/apk-output/app-debug.apk
          else
            cp "$APK" /tmp/apk-output/app-release.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}-${{ inputs.build_type }}
          path: /tmp/apk-output/*.apk
          if-no-files-found: error
          retention-days: 1
